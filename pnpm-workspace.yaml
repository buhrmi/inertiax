packages:
  - packages/*
  - packages/*/test-app
  - playgrounds/*
  - tests/app

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - esbuild@0.28.1
  - multer@2.2.0

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild

overrides:
  cookie: '>=0.7.0'
  '@tailwindcss/typography>postcss-selector-parser': '^7.1.6'

auditConfig:
  ignoreGhsas:
    # braces: disputed upstream with no fix planned, only reachable through dev tooling (es-check, nodemon)
    - GHSA-vfj7-8cjw-p6xm
